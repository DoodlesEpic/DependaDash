name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Preserve the annotated tag instead of fetching the event commit into its ref.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a version tag in vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          git merge-base --is-ancestor HEAD origin/main
          node <<'NODE'
          const assert = require('node:assert/strict')
          const fs = require('node:fs')
          const html = fs.readFileSync('index.html', 'utf8')
          const version = html.match(/<span class="version" aria-label="Version">(v\d+\.\d+\.\d+)<\/span>/)
          assert.equal(version?.[1], process.env.TAG, 'The interface version must match the release tag')
          NODE

      - name: Create GitHub release
        shell: bash
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --verify-tag --title "DependaDash $TAG" --generate-notes
          fi
